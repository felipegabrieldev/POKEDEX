<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/Pokebola-pokeball-png-0.png">
    <title> Pokedex </title>
</head>

<body>

    <section id="main-screen">

        <section class="upper">
            <div class="color-buttons" id="big-button"> </div>
            <div class="color-buttons" id="red"> </div>
            <div class="color-buttons" id="yellow"> </div>
            <div class="color-buttons" id="green"> </div>
        </section>

        <section id="border-screen">
            <button class="mini-buttons"> ◀ </button>
            <button class="mini-buttons"> ⏸ </button>
        </section>

        <section id="screen">

        </section>

        <section id="extras">
            <div class="circle"> </div>
            <div class="lines line-red"></div>
            <div class="lines line-blue"></div>
            <div class="green-lantern"> </div>
        </section>

        <section id="dpad-container">
            <button class="arrow arrow-up">▲</button>

            <div class="dpad-horizontal">
                <button class="arrow arrow-left">◀</button>
                <button class="arrow arrow-right">▶</button>
            </div>

            <button class="arrow arrow-down">▼</button>
        </section>

    </section>



    <section id="collum">
        <div class="inline-top"> </div>
        <div class="inline-bottom"> </div>
    </section>



    <section id="command-screen">

        <div class="small-screen"></div>
        <div class="dice"> </div>

        <div class="info">
            <p class="text"> type: </p>
        </div>

    </section>


</body>

</html>
